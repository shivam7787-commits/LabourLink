<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabourLink — Customer Portal</title>
  <meta name="description" content="Book verified on-demand skilled workers with transparent pricing, safe escrow payments, and live tracking.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .portal-nav-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-glass);
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .portal-nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .portal-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }
    .portal-brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: grid;
      place-items: center;
      color: white;
    }
    .portal-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-glass);
      border-radius: 30px;
      padding: 0.35rem 0.9rem 0.35rem 0.5rem;
    }
    .user-avatar-sm {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-weight: 700;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
    }
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.45rem 0.8rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <!-- Dedicated Customer Navigation -->
  <header class="portal-nav-bar">
    <div class="portal-nav-inner">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="customer.html" class="portal-brand">
          <div class="portal-brand-icon"><i data-lucide="home"></i></div>
          <div style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 800; color: #fff;">
            Labour<span style="color: #3b82f6;">Link</span>
          </div>
        </a>
        <span class="portal-tag"><i data-lucide="user-check" style="width:12px;height:12px;display:inline;"></i> Customer Portal</span>
      </div>

      <!-- Trust Indicator -->
      <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: #34d399; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); padding: 0.35rem 0.85rem; border-radius: 20px;">
        <i data-lucide="shield-check" style="width: 15px; height: 15px;"></i>
        <span>100% Escrow Protection Active</span>
      </div>

      <!-- User Profile & Sign Out -->
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div class="user-chip">
          <div class="user-avatar-sm" id="customerAvatarLetter">C</div>
          <div>
            <div id="customerUserName" style="font-size: 0.85rem; font-weight: 700; color: #fff;">Customer</div>
            <div id="customerUserSub" style="font-size: 0.72rem; color: var(--text-muted);">Verified Account</div>
          </div>
        </div>
        <button class="btn-logout" onclick="AuthSystem.logout()" title="Sign out of customer account">
          <i data-lucide="log-out" style="width: 14px; height: 14px;"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="main-content" id="mainContainer" style="padding-top: 1.5rem; padding-bottom: 3rem;">
    <div style="text-align: center; padding: 4rem;">
      <p style="color: var(--text-muted);">Loading Customer Booking Center...</p>
    </div>
  </main>

  <!-- Global Modals -->
  <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Engines & Dependencies -->
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/matchingEngine.js"></script>
  <script src="js/pricingEngine.js"></script>
  <script src="js/escrowEngine.js"></script>
  <script src="js/ratingPenaltyEngine.js"></script>
  <script src="js/views/customerView.js"></script>

  <script>
    // Global Toast Function
    window.showToast = function(title, body, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <div>
          <div class="toast-title">${title}</div>
          <div class="toast-body">${body}</div>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    };

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Enforce Customer Role Access
      const session = AuthSystem.requireAuth('customer');
      if (!session) return;

      // 2. Set user info in header
      const nameEl = document.getElementById('customerUserName');
      const subEl = document.getElementById('customerUserSub');
      const avatarEl = document.getElementById('customerAvatarLetter');
      if (nameEl) nameEl.textContent = session.name || 'Valued Customer';
      if (subEl) subEl.textContent = `${session.city || 'Mumbai'} • ${session.tier || 'Gold'} Member`;
      if (avatarEl && session.name) avatarEl.textContent = session.name.charAt(0).toUpperCase();

      // 3. Sync customer profile with Store
      const state = window.LabourLinkStore.getState();
      const currentCust = state.customers.find(c => c.id === session.id) || state.customers[0];
      if (session.name) currentCust.name = session.name;
      if (session.address) currentCust.addresses[0].address = session.address;

      // 4. Render Customer View
      const container = document.getElementById('mainContainer');
      CustomerView.render(container);
      lucide.createIcons();
    });
  </script>
</body>
</html>
